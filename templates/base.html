                "install_plugin_btn": "📦 プラグインをインストール",
                "dev_guide_title": "📝 OpenFrequency プラグイン開発完全ガイド",
                "dev_guide_section1_title": "一、前提条件と環境設定",
                "dev_guide_section1_content": "OpenFrequencyのプラグイン開発を開始する前に、開発環境が正しく構成されていることを確認することが不可欠です。このセクションでは、成功したプラグインを作成、テスト、デプロイするために必要なすべての前提条件と推奨ツールについて説明します。OpenFrequencyはPythonで構築されており、正しく機能するために特定の依存関係が必要です。プラグインシステムはすべてのスキルレベルの開発者が利用できるように設計されていますが、適切なツールと環境設定があれば、開発プロセスが大幅に簡素化され、潜在的な問題が減少します。以下の要件はプラグイン開発に必須であり、開発エクスペリエンスを向上させるための追加の推奨事項も提供されます。次のセクションに進む前に、各要件を慎重に読み、環境がすべての仕様を満たしていることを確認してください。前提条件の設定をスキップすると、後で環境構成の誤りから問題が発生した際、イライラするようなデバッグセッションになることがよくあります。開発環境を正しく設定する時間を取ってください—これはプラグイン開発の旅において大きな報酬をもたらします。",
                "dev_guide_section1_subsection1_title": "Python 3.10以降",
                "dev_guide_section1_subsection1_content": "OpenFrequencyはコアランタイム環境としてPython 3.10以降を必要とします。このバージョン要件は任意ではありません。これは、OpenFrequencyがコードベース全体で活用しているPython 3.10で導入された特定の言語機能とパフォーマンス向上に基づいています。Pythonをインストールする際、python.orgの公式Pythonインストーラーを使用することを推奨します。これにより、すべての必要なコンポーネントを含む最新の安定版を確実に入手できます。インストール後、ターミナルまたはコマンドプロンプトで'python --version'を実行してPythonのバージョンを確認してください。出力には3.10.x以降のバージョン番号が表示されるはずです。複数のPythonバージョンがインストールされている場合、pyenv（macOS/Linux上）またはWindowsのPython Launcherなどの仮想環境マネージャーを使用して、OpenFrequency開発に適切なバージョンを使用していることを確認してください。プラグイン開発には仮想環境が強く推奨されます。仮想環境はプロジェクトの依存関係をシステムPythonのインストールから分離し、異なるプロジェクト間の競合を防ぎます。仮想環境を作成するには、プラグイン開発ディレクトリに移動し、'python -m venv venv'を実行してから、'source venv/bin/activate'（macOS/Linux上）または'venv\\Scripts\\activate'（Windows上）でアクティベートします。これにより、システムPythonインストールに影響を与えずに依存関係をインストールできる分離されたPython環境が作成されます。プラグイン開発に関連するPythonコマンドの前に仮想環境をアクティベートすることを忘れないでください。",
                "dev_guide_section1_subsection2_title": "テキストエディターまたはIDE",
                "dev_guide_section1_subsection2_content": "優れたテキストエディターまたは統合開発環境（IDE）は、生産的なプラグイン開発に不可欠です。Python構文ハイライトをサポートするテキストエディターを使用できますが、優れたPythonサポート、豊富な拡張機能エコシステム、軽量なフットプリントにより、Visual Studio Code (VS Code)を強く推奨します。VS CodeはIntelliSenseコード補完、リアルタイム構文およびエラーチェック、統合ターミナル、Git統合、開発ワークフローを強化できる拡張機能の広大なマーケットプレイスを提供します。Python開発の場合、Microsoftの公式Python拡張機能をインストールしてください。これにより、コードリンティング、フォーマット、デバッグ、テスト、Jupyter notebookサポートなどの機能が追加されます。他の人気のあるPython IDEには、データベースツール、リモート開発、Web開発サポートなどの高度な機能を提供するPyCharm Professionalがありますが、これはより重いソリューションであり、学習曲線が急です。Sublime TextとAtomはプラグインを通じて良好なPythonサポートを提供する軽量な代替案です。選択したエディターに関係なく、Python構文ハイライトをサポートしていることを確認してください。これにより、コードが読みやすく、デバッグが容易になります。",
                "dev_guide_section1_subsection3_title": "OpenFrequencyのインストール",
                "dev_guide_section1_subsection3_content": "プラグインを開発する前に、システムにOpenFrequencyをインストールして実行している必要があります。まだOpenFrequencyをインストールしていない場合は、公式リポジトリまたはリリースページから最新バージョンをダウンロードしてください。OpenFrequencyはWindows、macOS、Linuxのスタンドアロン実行可能ファイルとして、およびソースから実行することを好む開発者向けのPythonパッケージとして利用できます。プラグイン開発の場合、Pythonに精通している場合は、ソースからOpenFrequencyを実行することを推奨します。これにより、デバッグログへのアクセスが容易になり、開発環境でプラグインをテストできます。ソースからインストールするには、リポジトリをクローンし、プロジェクトディレクトリに移動し、仮想環境を作成し、requirements.txtにリストされている依存関係をインストールし、'python app.py'を実行してアプリケーションを起動します。",
                "dev_guide_section1_item1": "Python 3.10+ 環境",
                "dev_guide_section1_item2": "テキストエディター（VS Code推奨）",
                "dev_guide_section1_item3": "OpenFrequencyがインストールされ実行中",
                "dev_guide_section2_title": "二、プラグインフォルダー構造の作成",
                "dev_guide_section2_content": "正しいフォルダー構造を設定することは、プラグイン開発の基礎的なステップです。OpenFrequencyは、適切な検出、ロード、およびリソース管理を確保するために、プラグインを特定のディレクトリ構造で整理することを期待しています。このセクションでは、プラグインに必要なフォルダー階層を作成する手順を説明し、各コンポーネントの目的と整理のベストプラクティスを説明します。構造が適切なプラグインは、開発を容易にするだけでなく、将来のOpenFrequencyバージョンとの互換性を確保し、コードを検査または変更する可能性のある他の開発者にとってプラグインをより保守しやすく理解しやすくします。プラグインフォルダー構造は、OpenFrequencyシステムがプラグインをロードして実行する方法の青写真として機能します。この構造を理解することが重要です。なぜなら、不適切なフォルダー構成は、プラグインの検出の失敗、リソースのロードエラー、およびデバッグが困難な他のランタイム問題につながる可能性があるからです。",
                "dev_guide_section2_subsection1_title": "標準ディレクトリレイアウト",
                "dev_guide_section2_subsection1_content": "OpenFrequencyプラグインは、OpenFrequencyインストールフォルダー内の「plugins/community」サブディレクトリに存在する必要があります。これは譲歩できない要件です—プラグイン検出システムは、コミュニティプラグイン用にこの特定のディレクトリのみをスキャンします。このディレクトリ内で、各プラグインはプラグインの一意の識別子で名前が付けられた独自のサブディレクトリを取得します。たとえば、プラグインIDが「my_weather_plugin」の場合、完全なパスは「OpenFrequency/plugins/community/my_weather_plugin/」になります。この分離により、プラグインが相互に干渉しないことが保証され、プラグインマネージャーがプラグインを独立してロード、アンロード、管理できます。プラグインディレクトリ内で、プラグインの機能に応じて複数のファイルとサブディレクトリを作成します。最も重要なファイルは「manifest.json」とPythonエントリーポイントファイル（通常は「plugin.py」と名付けられます）で、すべてのプラグインに必要です。",
                "dev_guide_section2_subsection2_title": "必須ファイル",
                "dev_guide_section2_subsection2_content": "各OpenFrequencyプラグインには、少なくとも2つのファイルが含まれている必要があります。「manifest.json」とPythonエントリーポイントファイルです。manifest.jsonファイルは最も重要なファイルです—これはプラグインの身分証明書と設定ドキュメントです。プラグインディレクトリのルートに配置する必要があります。manifest.jsonファイルには、プラグインの一意の識別子、表示名、バージョン番号、作成者情報、説明、およびフックと機能の設定など、プラグインに関する基本的なメタデータが含まれています。プラグインマネージャーは、プラグインを検出するときに最初にこのファイルを読み取り、マニフェストのエラーや必須フィールドの欠落はプラグインのロードを妨げます。",
                "dev_guide_section2_desc": "OpenFrequencyインストールディレクトリにプラグインフォルダーを作成：",
                "dev_guide_section3_title": "三、manifest.jsonの作成",
                "dev_guide_section3_content": "manifest.jsonファイルはプラグインの核心です—これはOpenFrequencyにプラグインに関する必要なすべてを伝える設定ドキュメントです。このファイルは、プラグインディレクトリのルートに配置された有効なJSONドキュメントである必要があります。マニフェストは複数の重要な目的を果たします。システムにプラグインを識別させ、プラグインが使用するフックを宣言し、プラグインが提供するリソースまたは機能を指定し、バージョンの互換性要件を定義します。manifest.jsonを正しく設定することが不可欠です。このファイルのエラーは、プラグインがプラグインマネージャーによって検出またはロードされるのを防ぐためです。このセクションでは、manifest.jsonの各フィールドの包括的なガイドを提供し、その目的、例、プラグイン設定を構築するためのベストプラクティスを概説します。",
                "dev_guide_section3_subsection1_title": "必須フィールド",
                "dev_guide_section3_subsection1_content": "manifest.jsonファイルには、プラグインが有効と見なされるために存在する必要があるいくつかの必須フィールドが含まれています。「id」フィールドは最も基本的なものです—これはsnake_case形式（小文字、数字、アンダースコアのみ）のプラグインの一意の識別子です。このIDは、インストールされているすべてのプラグインで一意である必要があります。「name」フィールドは、ユーザーがプラグインマネージャーインターフェイスで目にする人間が読める表示名です。「version」フィールドは「1.0.0」のようなセマンティックバージョニング（semver）形式に従います。「author」フィールドはプラグイン作成者を識別し、「description」フィールドはプラグイン機能の簡単な要約を提供します。",
                "dev_guide_section3_subsection2_title": "オプションフィールドと機能",
                "dev_guide_section3_subsection2_content": "必須フィールドに加えて、manifest.jsonは高度なプラグイン機能を可能にするいくつかのオプションフィールドをサポートしています。「min_app_version」フィールドを使用すると、プラグインが正しく機能するために必要なOpenFrequencyの最小バージョンを指定できます。「settings_schema」フィールドを使用すると、ユーザーがOpenFrequency設定インターフェイスを通じて構成できるプラグイン固有の設定のJSON-Schemaを定義できます。「cabin_scripts」フィールドは最も強力なオプション機能の1つです—プラグインがdata/cabin/scripts.json形式に従う客室アナウンススクリプトを提供できるようにします。",
                "dev_guide_section3_desc": "manifest.jsonはプラグインの設定ファイルで、基本情報と機能を定義します：",
                "dev_guide_section3_note_title": "重要な注意点：",
                "dev_guide_section3_note1": "idは一意のsnake_case形式である必要があります",
                "dev_guide_section3_note2": "cabin_scriptsはdata/cabin/scripts.json形式に厳密に従います",
                "dev_guide_section3_note3": "スクリプトフェーズは文字列またはオブジェクト（text/videoを含む）",
                "dev_guide_section3_note4": "min_app_versionで最小互換バージョンを指定できます",
                "dev_guide_section4_title": "四、plugin.pyの作成",
                "dev_guide_section4_content": "plugin.pyファイルはプラグインの実際のロジックが存在する場所です。このPythonファイルには、core.plugin_apiモジュールから提供されるOpenFrequencyPlugin基本クラスを継承するプラグインのメインクラスが含まれています。この基本クラスは、プラグインがOpenFrequencyのイベントシステム、構成管理、ロギング、およびその他のコアサービスと対話できるようにするフレームワークを提供します。プラグインクラスを正しく構築して実装することを理解することは、安定した保守可能でOpenFrequencyとシームレスに統合されるプラグインを作成するために不可欠です。このセクションでは、プラグインクラス構造、フックメソッド、APIメソッド、構成管理、エラー処理、およびクリーンで効率的なプラグインコードを記述するためのベストプラクティスについて説明します。",
                "dev_guide_section4_subsection1_title": "プラグインクラス構造",
                "dev_guide_section4_subsection1_content": "プラグインは「Plugin」という名前のクラスを定義する必要があります。これは厳密な要件です—プラグインマネージャーはこの名前のクラスを具体的に探します。クラスは任意のPythonファイルで定義できますが、ファイルはmanifest.json「entry」フィールドで指定する必要があります。OpenFrequencyPlugin基本クラスは、プラグインが使用できるいくつかの保護された属性とメソッドを提供します。「self.config」属性は、セッション間で持続するプラグイン構成を含む辞書です。「self.log()」メソッドを使用すると、プラグインIDをプレフィックスとして付けてログメッセージをOpenFrequencyのログ出力に書き込むことができます。「self.emit()」メソッドを使用すると、Webインターフェイスにsocket.ioイベントを送信できます。",
                "dev_guide_section4_subsection2_title": "フックメソッドの実装",
                "dev_guide_section4_subsection2_content": "フックメソッドはプラグインがOpenFrequencyと対話する主な方法です。各フックは特定のイベントまたはライフサイクル段階に対応します。「on_load()」フックはプラグインが有効になっているとき、またはプラグインがすでに有効になっている場合はOpenFrequencyが起動するときに呼び出されます。これはプラグインの状態を初期化し、構成を読み取り、イベントをサブスクライブし、タイマーを設定するなどの初期化タスクを実行する場所です。「on_unload()」フックはプラグインが無効になっているとき、またはOpenFrequencyがシャットダウンしているときに呼び出されます。",
                "dev_guide_section4_desc": "プラグインのエントリーポイントファイルで、動作を定義します：",
                "dev_guide_section5_title": "五、完全なフックリファレンス",
                "dev_guide_section5_content": "OpenFrequencyは、プラグインがアプリケーションライフサイクルの様々なイベントに応答できるようにする包括的なフックセットを提供します。このセクションは、利用可能なすべてのフックの完全なリファレンスとして機能し、それらのパラメータ、呼び出し時期、返すべきもの、および使用例を含みます。フックはOpenFrequencyとのプラグイン統合の主要なメカニズムです—プラグインが重要なイベントの通知を受け取り、オプションでアプリケーションの動作に影響を与えることを可能にします。各フックの目的、タイミング、戻り値のセマンティクスを理解することは、効果的なプラグインを書くために不可欠です。",
                "dev_guide_section5_subsection1_title": "ライフサイクルフック",
                "dev_guide_section5_subsection1_content": "ライフサイクルフックは、プラグインのライフタイムの特定のポイントで呼び出されます。「on_load()」フックはプラグインが有効になっているとき、またはプラグインがすでに有効になっている場合はOpenFrequencyが起動するときに呼び出されます。これはプラグインの状態を初期化し、構成を読み取り、イベントをサブスクライブし、タイマーを設定するなどの初期化タスクを実行する機会です。「on_unload()」フックはプラグインが無効になっているとき、またはOpenFrequencyがシャットダウンしているときに呼び出されます。これはタイマーをキャンセルし、イベントのサブスクライブを解除し、状態を保存するなどのクリーンアップタスクに使用してください。",
                "dev_guide_section5_subsection2_title": "シミュレーションフック",
                "dev_guide_section5_subsection2_content": "シミュレーションフックは、フライトシミュレーターへの接続と状態に関連しています。「on_sim_connected(sim_type)」フックは、OpenFrequencyがシミュレーターに正常に接続したときに呼び出されます。sim_typeパラメータは、シミュレータータイプ（「msfs」、「xplane」、「fsx」など）を示します。「on_sim_disconnected()」フックは、シミュレーターへの接続が失われたときに呼び出されます。",
                "dev_guide_section5_subsection3_title": "通信フック",
                "dev_guide_section5_subsection3_content": "通信フックは、無線通信とATCの相互作用に関連しています。「on_atc_response(text, action)」フックは最も強力なフックの1つです—OpenFrequencyがATC応答を生成するたびに呼び出されます。「on_pilot_input(text)」フックは、AIで処理するために送信されるテキストをユーザーが入力したときに呼び出されます。「on_frequency_change(freq)」フックは、COM1周波数が変更されたときに呼び出されます。",

                "dev_guide_section6_title": "六、プラグインAPIメソッドリファレンス",
                "dev_guide_section6_content": "OpenFrequencyPlugin基本クラスは、プラグインがOpenFrequencyシステムと対話するために使用できる豊富なAPIメソッドセットを提供します。これらのメソッドは、プラグインがメッセージをログし、Webインターフェイスにイベントを送信し、内部イベントをサブスクライブし、TTS再生をトリガーし、通知を送信し、合成ATCメッセージを注入し、タスクをスケジュールし、共有コンテキストにアクセスし、構成を管理することを可能にします。",
                "dev_guide_section6_subsection1_title": "ロギングとデバッグ",
                "dev_guide_section6_subsection1_content": "'self.log(msg)'メソッドは、プラグインからメッセージをログする主要なツールです。このメソッドは文字列メッセージを受け取り、プラグインIDをプレフィックスとして付けてOpenFrequencyのログ出力に書き込みます。これはデバッグとトラブルシューティングに非常に貴重です。",
                "dev_guide_section6_subsection2_title": "イベント通信",
                "dev_guide_section6_subsection2_content": "'self.emit(event, data)'メソッドは、プラグインがWebインターフェイスにsocket.ioイベントを送信できるようにします。これはUI要素を更新し、ユーザーにリアルタイム通知を送信する、またはWebインターフェイスのカスタムJavaScriptと通信するのに役立ちます。",

                "dev_guide_section7_title": "七、プラグインのテストとデバッグ",
                "dev_guide_section7_content": "テストは、プラグインが正しく機能し、エラーを引き起こさず、良好なユーザーエクスペリエンスを提供することを保証するプラグイン開発の重要な段階です。このセクションでは、包括的なテスト戦略、デバッグ手法、プラグイン機能を検証するためのベストプラクティスについて説明します。",
                "dev_guide_section7_subsection1_title": "手動テストワークフロー",
                "dev_guide_section7_subsection1_content": "手動テストワークフローは、プラグインフォルダーを正しい場所に配置することから始まります。フォルダー構造が正しいことを確認してください。OpenFrequencyを開き、プラグインマネージャーに移動します。「全プラグインをリロード」ボタンをクリックしてプラグイン検出をトリガーします。プラグインリストでプラグインを確認してください。",
                "dev_guide_section7_subsection2_title": "デバッグ手法",
                "dev_guide_section7_subsection2_content": "効果的なデバッグは、プラグインの問題を特定して修正するために不可欠です。最も基本的なデバッグツールはself.log()メソッドです。",
                "dev_guide_section7_item1": "プラグインフォルダーをplugins/community/に配置",
                "dev_guide_section7_item2": "OpenFrequencyプラグインマネージャーを開く",
                "dev_guide_section7_item3": "「全プラグインをリロード」をクリック",
                "dev_guide_section7_item4": "プラグインが正常に読み込まれたか確認（緑色バッジ）",
                "dev_guide_section7_item5": "ログ出力を確認して機能を検証",
                "dev_guide_section8_title": "八、パッケージ化と配布",
                "dev_guide_section8_content": "プラグインが開発されテストされたら、次のステップは他のユーザーに配布するためにパッケージ化することです。適切なパッケージ化により、他のユーザーが問題なくプラグインを簡単にインストールできるようになります。このセクションでは、ZIPアーカイブの作成、ファイルの正しい整理、命名規則、バージョン管理、配布チャネルを含む完全なパッケージ化プロセスについて説明します。",
                "dev_guide_section8_subsection1_title": "ZIPアーカイブの作成",
                "dev_guide_section8_subsection1_content": "OpenFrequencyプラグインの標準配布形式は、プラグインのファイルとディレクトリを含むZIPアーカイブです。ZIPアーカイブは特定の構造を持っている必要があります。Windowsでは、プラグインフォルダーを右クリックして「送る」→「圧縮（zip形式）フォルダー」を選択してZIPを作成できます。",
                "dev_guide_section8_subsection2_title": "ファイルの整理と命名",
                "dev_guide_section8_subsection2_content": "プラグインをパッケージ化する際は、アーカイブ内のファイルの整理方法を考慮してください。構造をシンプルで論理的に保ってください。",
                "dev_guide_section8_desc": "プラグインを配布用にパッケージ化：",
                "dev_guide_section8_item1": "プラグインフォルダーを右クリック",
                "dev_guide_section8_item2": "「送る」→「圧縮（zip形式）フォルダー」を選択",
                "dev_guide_section8_item3": "またはコマンドラインを使用：",
                "dev_guide_section8_note": "注意：ZIPファイルにはmanifest.jsonとplugin.pyがルートレベルに含まれている必要があります",
                "dev_guide_section9_title": "九、プラグインの公開と共有",
                "dev_guide_section9_content": "プラグインを公開すると、OpenFrequencyコミュニティで利用できるようになり、ユーザーがプラグインを発見、インストール、あなたの作業から恩恵を受けることができます。",
                "dev_guide_section9_subsection1_title": "GitHub公開ワークフロー",
                "dev_guide_section9_subsection1_content": "GitHubは、広く採用され、組み込みのリリース管理があり、OpenFrequencyコミュニティと統合されているため、OpenFrequencyプラグインを公開する推奨プラットフォームです。",
                "dev_guide_section9_subsection2_title": "ドキュメントとコミュニティエンゲージメント",
                "dev_guide_section9_subsection2_content": "良いドキュメントは、ユーザーの採用とサポートに不可欠です。",
                "dev_guide_section9_item1": "GitHubリポジトリを作成",
                "dev_guide_section9_item2": "ZIPファイルをReleaseとしてアップロード",
                "dev_guide_section9_item3": "READMEにインストール方法を記述",
                "dev_guide_section9_item4": "コミュニティでリンクを共有",
                "dev_guide_section10_title": "十、よくある質問",
                "dev_guide_section10_content": "このセクションでは、プラグイン開発者が開発プロセス中に遭遇する一般的な問題と質問に対処します。",
                "dev_guide_section10_subsection1_title": "プラグイン読み込みの問題",
                "dev_guide_section10_subsection1_content": "問：プラグインが読み込まれず、プラグインマネージャーに赤いバッジが表示されます。どうすればよいですか？答：まず、プラグインマネージャーでプラグインをクリックして具体的なエラーメッセージを確認してください。",
                "dev_guide_section10_subsection2_title": "メディアとリソースの問題",
                "dev_guide_section10_subsection2_content": "問：プラグインで定義されたメディアファイルが再生または表示されません。何が問題ですか？答：manifest.jsonのファイルパスがプラグインディレクトリに対して相対的であることを確認してください。",

        function applyLanguage(lang) {
            localStorage.setItem('language', lang);
            document.documentElement.lang = lang; // Accessibility

            const t = TRANSLATIONS[lang] || TRANSLATIONS['en'];

            // 1. Text Content
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.innerText = t[key];
                }
            });

            // 2. Placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) {
                    el.placeholder = t[key];
                }
            });

            // 3. Special Handling for PTT Button Logic (Dynamic)
            const pttBtn = document.getElementById('ptt-btn');
            if (pttBtn && !pttBtn.classList.contains('btn-danger')) {
                pttBtn.innerText = t['ptt_btn'];
            }
        }

        // Init - apply saved language to all pages
        const savedLang = localStorage.getItem('language') || 'en';
        applyLanguage(savedLang);

        // Event Listener for lang-selector if it exists on this page
        const langSelector = document.getElementById('lang-selector');
        if (langSelector) {
            langSelector.value = savedLang;
            langSelector.addEventListener('change', (e) => {
                applyLanguage(e.target.value);
            });
        }

    <!-- Admin Toasts (Hidden by default, shown via JS) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container" style="z-index: 9999;">
        <!-- Toasts injected here -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotatedmarker@0.2.0/leaflet.rotatedMarker.min.js"></script>

    <script>
        // Admin Security Logic
        // Note: socket is defined in child templates usually, but checking here if it exists globally or re-using
        // Safer to check if socket exists or init a listener if we are on a page with socket.
        // Actually, let's assume socket is available if the page included it.
        // But base.html doesn't init socket. dashboard.html does.
        // We need this logic to run on dashboard.

        document.addEventListener('DOMContentLoaded', () => {
            if (window.socket) {
                // Handle force logout when access is revoked
                window.socket.on('force_logout', (data) => {
                    console.log("Access revoked, redirecting to waiting room...", data);
                    // Clear auth cookie
                    document.cookie = 'auth_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    // Redirect to waiting room
                    window.location.href = '/waiting_room';
                });

                // Handle permission change - force page refresh
                window.socket.on('permission_changed', (data) => {
                    console.log("Permission changed to:", data.permission);
                    // Force refresh to apply new permissions
                    window.location.reload();
                });

                window.socket.on('join_request', (data) => {
                    console.log("Admin: Join Request from", data);
                    const container = document.getElementById('toast-container');

                    const toastId = `toast-${data.sid}`;
                    const html = `
                        <div id="${toastId}" class="toast show text-white bg-dark" role="alert" aria-live="assertive" aria-atomic="true">
                          <div class="toast-header bg-secondary text-white">
                            <strong class="me-auto">📡 New Connection Request</strong>
                            <small>Just now</small>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
                          </div>
                          <div class="toast-body">
                            <p class="mb-1"><strong>Device:</strong> ${data.device_name}</p>
                            <p class="mb-2 small text-muted">IP: ${data.ip}</p>
                            <div class="d-grid gap-2 d-md-block">
                              <button class="btn btn-sm btn-success w-100 mb-1" onclick="approveAuth('${data.sid}', 'trust')">Allow & Trust</button>
                               <div class="btn-group w-100" role="group">
                                    <button class="btn btn-sm btn-outline-light" onclick="approveAuth('${data.sid}', 'allow_once')">Once</button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="denyAuth('${data.sid}', 'deny')">Deny</button>
                               </div>
                            </div>
                          </div>
                        </div>
                     `;

                    // Create element
                    const wrap = document.createElement('div');
                    wrap.innerHTML = html;
                    container.appendChild(wrap.firstElementChild);
                });
            }
        });

        window.approveAuth = function (sid, type) {
            socket.emit('admin_decision', { sid: sid, action: type });
            document.getElementById(`toast-${sid}`).remove();
        };

        window.denyAuth = function (sid, type) {
            socket.emit('admin_decision', { sid: sid, action: type });
            document.getElementById(`toast-${sid}`).remove();
        };

        // Toggle function for settings page
        window.toggleDarkMode = function (enabled) {
            document.body.classList.toggle('dark-mode', enabled);
            localStorage.setItem('dark_mode', enabled ? '1' : '0');
        };

        // Theme selection — persists in localStorage; applies CSS class to <html>
        window.applyTheme = function (theme) {
            // Remove all known theme classes then apply the selected one
            document.documentElement.classList.remove('theme-classic', 'theme-apple');
            document.documentElement.classList.add(`theme-${theme}`);
            localStorage.setItem('ui_theme', theme);
        };

        // 主题类已在 <head> 内联脚本设置，此处仅做同步确认
        (function () {
            const t = localStorage.getItem('ui_theme') || 'classic';
            document.documentElement.classList.remove('theme-classic', 'theme-apple');
            document.documentElement.classList.add(`theme-${t}`);
        })();

        // Dark mode（<head> 里已标记 dark-mode-pending，此处转移到 body）
        if (document.documentElement.classList.contains('dark-mode-pending') ||
            localStorage.getItem('dark_mode') === '1') {
            document.body.classList.add('dark-mode');
            document.documentElement.classList.remove('dark-mode-pending');
        }

        // Setup socket listeners after a short delay to ensure socket is initialized
        function setupSocketListeners() {
            if (!window.socket) {
                // Retry after 100ms if socket not ready yet
                setTimeout(setupSocketListeners, 100);
                return;
            }

            console.log("Setting up socket listeners for toasts...");

            // Flight Report Toast notification
            window.socket.on('flight_report_ready', (data) => {
                console.log("Flight Report Ready:", data);
                const container = document.getElementById('toast-container');
                if (!container) return;

                const toastId = `toast-flight-report-${Date.now()}`;
                const html = `
                    <div id="${toastId}" class="toast show text-white bg-info" role="alert" aria-live="assertive" aria-atomic="true">
                      <div class="toast-header bg-info text-white">
                        <strong class="me-auto">🎉 航程结束 / Flight Complete</strong>
                        <small>Just now</small>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
                      </div>
                      <div class="toast-body">
                        <p class="mb-2">${data.message || 'Flight report generated!'}</p>
                        <a href="${data.report_url || '#'}" target="_blank" class="btn btn-light btn-sm w-100">📊 View Report / 查看详单</a>
                      </div>
                    </div>
                `;
                const wrap = document.createElement('div');
                wrap.innerHTML = html;
                container.appendChild(wrap.firstElementChild);

                // Auto-dismiss after 15 seconds
                setTimeout(() => {
                    const toastEl = document.getElementById(toastId);
                    if (toastEl) toastEl.remove();
                }, 15000);
            });

            // 服务端保存设置后推送 config_sync，同步深色模式及其他运行时配置
            window.socket.on('config_sync', (cfg) => {
                // 深色模式
                const darkMode = cfg?.ui?.dark_mode || false;
                document.body.classList.toggle('dark-mode', darkMode);
                localStorage.setItem('dark_mode', darkMode ? '1' : '0');
                // 将完整摘要以自定义事件广播给各页面模块（如 dashboard 的无线电效果开关）
                window.dispatchEvent(new CustomEvent('lg-config-sync', { detail: cfg }));
            });
        }

        // Start socket listener setup after DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(setupSocketListeners, 200);
        });
    </script>
